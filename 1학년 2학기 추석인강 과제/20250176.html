<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>숫자 비교 프로그램</title>
</head>
<body>
    <script>
        for (let i = 1; i <= 5; i++) {
            let str1 = prompt(`${i}번째: 첫 번째 숫자를 입력하세요:`);
            let str2 = prompt(`${i}번째: 두 번째 숫자를 입력하세요:`);
            let num1 = parseFloat(str1);
            let num2 = parseFloat(str2);

            if (!isNaN(num1) && !isNaN(num2)) {
                if (num1 > num2) {
                    alert(`${i}번째 결과: ${num1}이(가) ${num2}보다 큽니다.`);
                    console.log(`${i}번째 결과: ${num1}이(가) ${num2}보다 큽니다.`);
                } else if (num2 > num1) {
                    alert(`${i}번째 결과: ${num2}이(가) ${num1}보다 큽니다.`);
                    console.log(`${i}번째 결과: ${num2}이(가) ${num1}보다 큽니다.`);
                } else {
                    alert(`${i}번째 결과: 두 숫자는 같습니다.`);
                    console.log(`${i}번째 결과: 두 숫자는 같습니다.`);
                }
            } else {
                alert(`${i}번째: 유효한 숫자를 입력해주세요.`);
                console.log(`${i}번째: 유효하지 않은 입력입니다.`);
            }
        }
    </script>
</body>
</html>
